name: Curriculum synchronization
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
concurrency:
  group: curriculum-sync
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run curriculum:discover -- --refresh
      - run: npm run curriculum:sync -- --refresh
      - run: npm run curriculum:validate && npm run questions:validate && npm test
      - run: npm run db:prepare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: curriculum-sync
          path: |
            reports/
            data/discovery.json
            data/curriculum.json
            data/import.sql
      # Approval of the artifact is the production promotion gate.
  promote:
    needs: ingest
    if: github.event_name == 'workflow_dispatch'
    environment: curriculum-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: curriculum-sync
      - run: npx wrangler d1 execute learn-lab --remote --file data/import.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
